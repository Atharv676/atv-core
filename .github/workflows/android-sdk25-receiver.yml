      - name: Lower minSdk to 25 and build debug APK
        run: |
          sed -i 's/minSdk = 26/minSdk = 25/' android-tv/app/build.gradle.kts
          chmod +x ./scripts/*.sh ./android-tv/gradlew
          ./scripts/build_android.sh debug

      - uses: actions/upload-artifact@v4
        with:
          name: Atharv-Remote-Receiver-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
