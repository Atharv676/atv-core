
name: Build FakeAtv APK - Fire TV SDK 25

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Find Android NDK
        shell: bash
        run: |
          NDK_PATH=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Set Android SDK 25
        shell: bash
        run: |
          sed -i 's/minSdk = 26/minSdk = 25/' android-tv/app/build.gradle.kts
          chmod +x ./android-tv/gradlew
          chmod +x ./scripts/*.sh

      - name: Build Android APK
        run: ./scripts/build_android.sh debug

      - name: Verify APK
        run: |
          ls -lh android-tv/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeAtv-FireTV-SDK25
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
