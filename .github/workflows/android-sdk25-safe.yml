name: Build Atharv Remote Receiver APK (safe)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Find pre-installed NDK
        run: |
          NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n1)
          if [ -z "$NDK_PATH" ] && [ -n "$ANDROID_NDK_ROOT" ]; then NDK_PATH="$ANDROID_NDK_ROOT"; fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

